<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابزارک</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 10px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>ابزارک</h1>
    <p>سایت ابزارهای کاربردی</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🎯 خوش آمدید</h2>
      <p>
        به ابزارک خوش آمدید. اینجا قراره ابزارهای کاربردی و ساده
        در اختیار شما قرار بگیره.
      </p>
    </div>

    <div class="card">
      <h2>🚀 شروع کار</h2>
      <p>برای شروع روی دکمه زیر بزن.</p>
      <button onclick="start()">شروع</button>
    </div>

  </div>

  <footer>
    © 2026 ابزارک
  </footer>

  <script>
    function start() {
      alert("به ابزارک خوش آمدید! 🚀");
    }
  </script>

</body>
</html>
